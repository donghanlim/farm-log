y="200" width="470" height="220" rx="18" fill="#14241d" stroke="#9fb6e5" stroke-opacity=".5"/><rect x="1087" y="222" width="5" height="30" rx="2" fill="#9fb6e5"/><text x="1105" y="240" fill="#9fb6e5" font-size="14" font-weight="600">COMMUNITY</text><text x="1089" y="282" fill="#f4f6ec" font-size="30" font-weight="700">임. 大 공간</text><text x="1089" y="317" fill="#d3ddd7" font-size="17" font-weight="400">문화 · 커뮤니티 · 교육 · 관계</text><text x="1089" y="345" fill="#d3ddd7" font-size="17" font-weight="400">플레라플레로와 연계하는 도시 접점</text><text x="1089" y="373" fill="#d3ddd7" font-size="17" font-weight="400">개인 고민·고객정보를 농업 DB에 섞지 않음</text><path d="M300 420 V460 H800 V485 M800 420 V485 M1300 420 V460 H800" fill="none" stroke="#739780" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="485" width="1160" height="220" rx="22" fill="#1c3625" stroke="#9ed58e"/><text x="255" y="526" fill="#b1de9e" font-size="14" font-weight="600">SHARED EVIDENCE PRODUCT</text><text x="255" y="573" fill="#f5f8ed" font-size="38" font-weight="700">FarmLog  팜로그</text><text x="255" y="612" fill="#e7eee4" font-size="23" font-weight="400">현장 입력 → 구조화 → 누락 보완 → 사람 확인 → 정정 원장 → 검토용 증빙</text><text x="255" y="650" fill="#b3c6b8" font-size="17" font-weight="400">지금: 합성 데이터·규칙 기반 로컬 MVP   /   다음: 동의받은 실제 농가·STT/LLM·공식 서식 검증</text><text x="255" y="679" fill="#e1c08b" font-size="17" font-weight="400">농약 안전 판정·인증 보장·자동 제출·시설 제어는 현재 범위 밖</text><path d="M580 705 V760 H400 V790 M1020 705 V760 H1190 V790" fill="none" stroke="#739780" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="65" y="790" width="720" height="230" rx="18" fill="#14241d" stroke="#9ed58e" stroke-opacity=".5"/><rect x="87" y="812" width="5" height="30" rx="2" fill="#9ed58e"/><text x="105" y="830" fill="#9ed58e" font-size="14" font-weight="600">GLOBAL PATH A  /  SOFTWARE FIRST</text><text x="89" y="872" fill="#f4f6ec" font-size="30" font-weight="700">국내 반복 사용 → 해외 1국 PoC</text><text x="89" y="907" fill="#d3ddd7" font-size="17" font-weight="400">한 작목·한 서식 → 작목반 유료 실증 → 국내 수출농가</text><text x="89" y="935" fill="#d3ddd7" font-size="17" font-weight="400">→ 해외 1개국 · 1개작목 · 1개 현지 파트너</text><text x="89" y="963" fill="#d3ddd7" font-size="17" font-weight="400">국가별 언어·규칙·서식 adapter | 번역만으로 진출하지 않기</text><rect x="815" y="790" width="720" height="230" rx="18" fill="#14241d" stroke="#e1c08b" stroke-opacity=".5"/><rect x="837" y="812" width="5" height="30" rx="2" fill="#e1c08b"/><text x="855" y="830" fill="#e1c08b" font-size="14" font-weight="600">GLOBAL PATH B  /  REAL ECONOMY</text><text x="839" y="872" fill="#f4f6ec" font-size="30" font-weight="700">국내 생산성 → 현지 생산·제한 수출</text><text x="839" y="907" fill="#d3ddd7" font-size="17" font-weight="400">아빠채소 1개 작목 → 원가·안전·폐기·재주문 실측</text><text x="839" y="935" fill="#d3ddd7" font-size="17" font-weight="400">→ 현지 파트너 생산 / 허용 품목의 소량 수출</text><text x="839" y="963" fill="#d3ddd7" font-size="17" font-weight="400">검역·콜드체인·공헌이익 통과 전 대규모 시설 투자 보류</text><rect x="65" y="1060" width="1470" height="170" rx="18" fill="#18251e" stroke="#324c3b"/><text x="90" y="1096" fill="#b7d4b4" font-size="17" font-weight="600">EXECUTION GATES  /  비전은 넓게, 실행은 하나부터</text><text x="90" y="1136" fill="#f4f6ec" font-size="25" font-weight="700">지금</text><text x="90" y="1170" fill="#d3ddd7" font-size="17" font-weight="400">로컬 검토 MVP + 실제 데이터 준비</text><text x="510" y="1136" fill="#f4f6ec" font-size="25" font-weight="700">다음 2주</text><text x="510" y="1170" fill="#d3ddd7" font-size="17" font-weight="400">5농가 중 3명 지속 → 6주 현장 MVP</text><text x="990" y="1136" fill="#f4f6ec" font-size="25" font-weight="700">확장 전</text><text x="990" y="1170" fill="#d3ddd7" font-size="17" font-weight="400">유료 재계약 · 원가 · 자격 · 데이터 권리</text><text x="90" y="1206" fill="#e1c08b" font-size="17" font-weight="400">지원사업: 기술창업 사업화 / 영농정착·융자 / 시설 실증 / 해외 PoC를 분리하고, 사업자등록 전 자격 충돌 확인</text><text x="65" y="1276" fill="#8fa294" font-size="16" font-weight="400">현재: 실제 농가 데이터 0건 · 로컬 M0 구현 · 합성 회귀 검증만 완료. 매출·해외시장·실제 AI 성능은 검증 전.</text></g></svg>