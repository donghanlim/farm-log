<dialog id="consent"><h2>내 기기에 농사 기록을 남겨요</h2><p>입력한 말·글·사진은 이 브라우저의 임시보관함과 이 컴퓨터의 로컬 서버에 남아요. 연결이 끊겨도 미전송 입력을 다시 보낼 수 있어요.</p><p>음성·사진·AI 처리는 로컬 도구만 사용해요. 음성은 브라우저 안의 로컬 모델로 처리하며, 외부 음성인식 서비스는 쓰지 않아요. 도구가 없으면 직접 글로 보완할 수 있어요.</p><p class="muted">아직 개인 시험용이에요. 비민감 시험 입력만 사용하고, 공용 기기나 실제 농가의 개인정보는 넣지 마세요.</p><button id="agree" class="primary">안내를 확인하고 시작</button></dialog>
